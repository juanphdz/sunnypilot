name: Sync release-tizi and jphxprius from upstream

on:
  schedule:
    - cron: '0 13 * * *'  # daily, 13:00 UTC (~6am Pacific)
  workflow_dispatch:  # allows manual trigger from github.com or the GitHub mobile app

permissions:
  contents: write
  issues: write  # needed to open the "new upstream changes" notification issue

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/sunnypilot/sunnypilot.git
          git fetch upstream release-tizi
          git fetch origin release-tizi jphxprius

      - name: Fast-forward release-tizi from upstream
        id: sync_release_tizi
        run: |
          git checkout -B release-tizi origin/release-tizi
          before=$(git rev-parse HEAD)
          git merge --ff-only upstream/release-tizi
          after=$(git rev-parse HEAD)
          git push origin release-tizi
          if [ "$before" != "$after" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "before=$before" >> "$GITHUB_OUTPUT"
            echo "after=$after" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge into jphxprius
        run: |
          git checkout -B jphxprius origin/jphxprius
          git merge release-tizi -m "Merge release-tizi into jphxprius (auto-sync)"
          git push origin jphxprius

      - name: Open notification issue on new upstream changes
        if: steps.sync_release_tizi.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          log=$(git log --oneline "${{ steps.sync_release_tizi.outputs.before }}..${{ steps.sync_release_tizi.outputs.after }}")
          gh issue create --repo "${{ github.repository }}" \
            --title "release-tizi synced: new upstream changes ($(date -u +%Y-%m-%d))" \
            --body "$(printf 'New commits pulled from upstream release-tizi and merged into jphxprius:\n\n```\n%s\n```' "$log")"
